<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boutique en ligne - Panier</title>
    <!--Lien CSS-->
    <link rel="stylesheet" href="css/style.css">
    <!--Box Icons-->
    <link href='https://unpkg.com/boxicons@2.1.1/css/boxicons.min.css' rel="stylesheet">
</head>
<body>
<!--Header-->
<header>
    <!--Nav-->
    <div class="nav container">
        <a href="#" class="logo">Boutique</a>

        <!--Icône panier-->
        <div class="cart-icon-container">
            <i class='bx bx-shopping-bag' id="cart-icon"></i>
            <span class="cart-count">0</span>
        </div>

        <!--Panier-->
        <div class="cart">

            <h2 class="cart-title">Votre panier</h2>

            <!--Contenu-->
            <div class="cart-content">

                <!-- Message panier vide -->
                <p class="empty-cart-message">Votre panier est vide.</p>

            </div>

            <!-- Code promo -->
            <div class="promo">
                <input type="text" id="promo-code" placeholder="Code promo">
                <button type="button" id="promo-button">Appliquer</button>
                <p id="promo-message"></p>
            </div>

            <!-- Récapitulatif -->
            <div class="cart-summary">

                <div class="summary-line">
                    <span>Sous-total</span>
                    <span class="subtotal-price">0,00 €</span>
                </div>

                <div class="summary-line">
                    <span>Livraison</span>
                    <span class="shipping-price">4,99 €</span>
                </div>

                <div class="summary-line discount-line">
                    <span>Réduction</span>
                    <span class="discount-price">0,00 €</span>
                </div>

                <div class="total">
                    <div class="total-title">Total TTC</div>
                    <div class="total-price">0,00 €</div>
                </div>

            </div>

            <!--Bouton acheter-->
            <button type="button" class="btn-buy">
                Passer la commande
            </button>

            <!--Fermer le panier-->
            <i class='bx bx-x' id="close-cart"></i>

        </div>
    </div>
</header>
    <!--Boutique-->
    <section class="shop container">
        <h2 class="section-title">Nos produits</h2>
        <!--Contenu-->
        <div class="shop-content">
            <!--Produit 1-->
            <div class="product-box">
                <img src="img/product1.jpg" alt="" class="product-img">
                <h2 class="product-title">T-SHIRT ADDIDAS</h2>
                <span class="price">25 €</span>
                <i class='bx bx-shopping-bag add-cart'></i>
            </div>
            <!--Produit 2-->
            <div class="product-box">
                <img src="img/product2.jpg" alt="" class="product-img">
                <h2 class="product-title">AIR POD</h2>
                <span class="price">100 €</span>
                <i class='bx bx-shopping-bag add-cart'></i>
            </div>
            <!--Produit 3-->
            <div class="product-box">
                <img src="img/product3.jpg" alt="" class="product-img">
                <h2 class="product-title">HIVER PARKA</h2>
                <span class="price">45 €</span>
                <i class='bx bx-shopping-bag add-cart'></i>
            </div>
            <!--Produit 4-->
            <div class="product-box">
                <img src="img/product4.jpg" alt="" class="product-img">
                <h2 class="product-title">GOURDE EN METAL</h2>
                <span class="price">24.04 €</span>
                <i class='bx bx-shopping-bag add-cart'></i>
            </div>
            <!--Produit 5-->
            <div class="product-box">
                <img src="img/product5.jpg" alt="" class="product-img">
                <h2 class="product-title">LUNETTES DE SOLEIL</h2>
                <span class="price">50 €</span>
                <i class='bx bx-shopping-bag add-cart'></i>
            </div>
            <!--Produit 6-->
            <div class="product-box">
                <img src="img/product6.1.jpg" alt="" class="product-img">
                <h2 class="product-title">CASQUETTE</h2>
                <span class="price">50 €</span>
                <i class='bx bx-shopping-bag add-cart'></i>
            </div>
            <!--Produit 7-->
            <div class="product-box">
                <img src="img/product7.jpg" alt="" class="product-img">
                <h2 class="product-title">SAC A DOS</h2>
                <span class="price">70 €</span>
                <i class='bx bx-shopping-bag add-cart'></i>
            </div>
            <!--Produit 8-->
            <div class="product-box">
                <img src="img/product8.jpg" alt="" class="product-img">
                <h2 class="product-title">CHAUSSURE SPORT</h2>
                <span class="price">45 €</span>
                <i class='bx bx-shopping-bag add-cart'></i>
            </div>
        </div>
    </section>
    <!--Lien vers JS-->
    <script src="js/main.js"></script>

</body>
</html>
